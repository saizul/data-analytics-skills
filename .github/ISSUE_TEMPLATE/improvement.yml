name: Improve a skill
description: A new option, a better workflow step, a missing export format or edge case, clearer docs
labels: ["enhancement"]
body:
  - type: input
    id: skill
    attributes:
      label: Skill
      placeholder: "sales-report"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What should change and why?
      description: For a new export format or edge case, include a small anonymised sample and the expected result.
    validations:
      required: true
